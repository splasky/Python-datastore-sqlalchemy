[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "python-datastore-sqlalchemy"
version = "0.0.3"
description = "SQLAlchemy dialect for google cloud datastore"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "HY Chang(splasky)", email = "hychang.1997.tw@gmail.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database :: Front-Ends",
    "Operating System :: POSIX :: Linux",
]
keywords = ["SQLAlchemy", "GCP", "Datastore"]
dependencies = [
    "sqlalchemy>=1.4.16,<3.0.0",
    "google-cloud-datastore>=2.21.0",
    "google-cloud-firestore>=2.21.0",
    "google-cloud-bigquery>=3.35.0",
    "google-auth>=2.40.0",
    "sqlglot>=28.0.0",
    "pandas>=2.0.0",
    "requests",
]

[project.entry-points."sqlalchemy.dialects"]
datastore = "sqlalchemy_datastore:CloudDatastoreDialect"

[project.urls]
Documentation = "https://github.com/splasky/python-datastore-sqlalchemy/wiki"
Source = "https://github.com/splasky/python-datastore-sqlalchemy"
Tracker = "https://github.com/splasky/python-datastore-sqlalchemy/issues"

[dependency-groups]
dev = [
    "coverage==7.9.2",
    "flake8==7.3.0",
    "mypy",
    "pytest==9.0.3",
    "pytest-cov==6.2.1",
    "pytest-html==4.1.1",
    "pytest-mypy==1.0.1",
    "pytest-ruff==0.5",
    "ruff",
]



[tool.setuptools.packages.find]
include = ["sqlalchemy_datastore*"]

[tool.pytest.ini_options]
addopts = "--ruff --mypy --cov --cov-report=html"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C", "G", "S"]
ignore = [
    "E501",  # Line too long - allow longer lines for SQL strings in tests
    "S608",  # SQL injection - intentional for test cases
    "B007",  # Loop variable not used - common in test assertions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S608", "E501", "S101", "B007", "S603"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["var-annotated", "import-untyped"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
